<!DOCTYPE html>

  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" />

  <link rel="stylesheet" href="style.css" />
  <style>
    .notfound-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.20;
      pointer-events: none;
    }
    .notfound-orb--1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--color-purple) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: orbFloat 8s ease-in-out infinite;
    }
    .notfound-orb--2 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, var(--color-gold) 0%, transparent 70%);
      bottom: -80px; left: -80px;
      animation: orbFloat 10s ease-in-out infinite 3s;
    }
    .notfound-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    .floating-icons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .floating-icon {
      position: absolute;
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatCard 6s ease-in-out infinite;
      box-shadow: var(--shadow-md);
    }
    [data-theme="dark"] .floating-icon {
      background: var(--bg-dark-card);
      border-color: var(--border-dark);
    }
    .floating-icon svg {
      stroke: var(--color-purple-light);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fi-1 { width:52px; height:52px; top:15%; left:8%; animation-delay:0s; }
    .fi-2 { width:44px; height:44px; top:25%; right:10%; animation-delay:1.5s; }
    .fi-3 { width:48px; height:48px; bottom:20%; left:12%; animation-delay:3s; }
    .fi-4 { width:40px; height:40px; bottom:30%; right:8%; animation-delay:4.5s; }
    .fi-5 { width:56px; height:56px; top:50%; left:5%; animation-delay:2s; }
  </style>
</head>
<body>

<nav id="navbar" role="navigation" aria-label="Main navigation">

        <svg class="icon-sun"  viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="notfound-page">

    <div class="notfound-orb notfound-orb--1" aria-hidden="true"></div>
    <div class="notfound-orb notfound-orb--2" aria-hidden="true"></div>

    <!-- Floating icons -->
    <div class="floating-icons" aria-hidden="true">
      <div class="floating-icon fi-1">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
      </div>
      <div class="floating-icon fi-2">
        <svg width="20" height="20" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <div class="floating-icon fi-3">
        <svg width="22" height="22" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

      <div class="floating-icon fi-4">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="floating-icon fi-5">
        <svg width="26" height="26" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
    </div>

    <div class="notfound-content">
      <span class="notfound-num">404</span>

      <div class="eyebrow" style="justify-content:center; margin-bottom:1.5rem;">Page Not Found</div>

      <h1 style="font-size:clamp(1.75rem, 4vw, 2.75rem); margin-bottom:1rem;">
        Looks Like This Page<br/>Went Viral…
      </h1>
      <p style="font-size:var(--text-lg); margin-bottom:3rem;">
        …and disappeared. The page you're looking for doesn't exist, or it may have moved.
      </p>

      <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-primary btn-lg btn-magnetic">
          Return Home
          <svg class="btn-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <a href="contact.html" class="btn btn-secondary btn-lg">Contact Us</a>
      </div>

      <!-- Quick links -->
      <div style="margin-top:4rem; padding-top:2rem; border-top:1px solid var(--border-light);">
        <p style="font-size:var(--text-sm); margin-bottom:1.25rem; color:var(--text-tertiary);">Or jump to a page:</p>
        <div style="display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center;">
          <a href="services.html" class="btn btn-secondary btn-sm">Services</a>
          <a href="pricing.html"  class="btn btn-secondary btn-sm">Pricing</a>
          <a href="portfolio.html" class="btn btn-secondary btn-sm">Portfolio</a>

</main>

</html>
